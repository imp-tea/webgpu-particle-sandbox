<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Particle Sandbox</title>
  </head>
  <body>
    <main id="app">
      <canvas id="sim-canvas"></canvas>
      <section id="controls" aria-label="Simulation controls">
        <div class="title-row">
          <div>
            <h1>Particle Sandbox</h1>
            <p id="gpu-status">Initializing WebGPU...</p>
            <p id="debug-stats">substeps 2x | cell max -- | encode --ms | frame --ms</p>
          </div>
          <div class="button-row">
            <button id="pause-button" type="button">Pause</button>
            <button id="reset-button" type="button">Reset</button>
          </div>
        </div>

        <label>
          <span>Particles <output id="particle-count-output">10000</output></span>
          <input id="particle-count" type="range" min="1000" max="50000" step="1000" value="10000" />
        </label>

        <label>
          <span>Gravity <output id="gravity-output">280</output></span>
          <input id="gravity" type="range" min="-600" max="1000" step="10" value="280" />
        </label>

        <label>
          <span>Damping <output id="damping-output">0.25</output></span>
          <input id="damping" type="range" min="0" max="2" step="0.01" value="0.25" />
        </label>

        <label>
          <span>Substeps <output id="substeps-output">2</output></span>
          <input id="substeps" type="range" min="1" max="8" step="1" value="2" />
        </label>

        <label>
          <span>Bond iterations <output id="bond-iterations-output">4</output></span>
          <input id="bond-iterations" type="range" min="1" max="8" step="1" value="4" />
        </label>

        <label>
          <span>Elasticity <output id="soft-body-strength-output">2600</output></span>
          <input id="soft-body-strength" type="range" min="0" max="6000" step="50" value="2600" />
        </label>

        <label>
          <span>Viscosity <output id="viscosity-output">4.0</output></span>
          <input id="viscosity" type="range" min="0" max="16" step="0.5" value="4" />
        </label>

        <label>
          <span>Mouse force <output id="mouse-force-output">60000</output></span>
          <input id="mouse-force" type="range" min="0" max="180000" step="5000" value="60000" />
        </label>

        <label>
          <span>Repulsion <output id="repulsion-output">180</output></span>
          <input id="repulsion" type="range" min="0" max="800" step="10" value="180" />
        </label>

        <label>
          <span>Cohesion <output id="cohesion-output">0.08</output></span>
          <input id="cohesion" type="range" min="0" max="1.5" step="0.01" value="0.08" />
        </label>

        <label>
          <span>Materials</span>
          <select id="material-preset">
            <option value="mixed">Mixed</option>
            <option value="granular">Granular</option>
            <option value="liquid">Liquid</option>
            <option value="separated">Separated</option>
          </select>
        </label>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
